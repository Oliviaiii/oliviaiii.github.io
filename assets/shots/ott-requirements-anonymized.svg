<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
  <title id="title">需求如何被整理成系統規則</title>
  <desc id="desc">去識別化的節目表資料介接需求證據，呈現資料來源、解析、檢核、安全覆蓋與通知紀錄流程。</desc>
  <rect width="760" height="920" fill="#f7f8f7"/>
  <rect x="32" y="32" width="696" height="856" rx="18" fill="#ffffff" stroke="#d8dedc"/>
  <text x="64" y="78" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="2" fill="#007f73">ANONYMIZED SPEC EVIDENCE</text>
  <text x="64" y="132" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="700" fill="#101414">需求如何被整理成</text>
  <text x="64" y="176" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="700" fill="#007f73">可交付的系統規則</text>
  <text x="64" y="212" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#5d6865">原始文件已移除機關、公司、聯絡資訊、金額、日期與內部識別資料。</text>

  <line x1="92" y1="264" x2="92" y2="732" stroke="#8cc8c1" stroke-width="3"/>

  <circle cx="92" cy="284" r="18" fill="#007f73"/>
  <text x="92" y="290" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#ffffff">01</text>
  <rect x="128" y="248" width="552" height="88" rx="12" fill="#f1f7f6" stroke="#c8dedb"/>
  <text x="152" y="279" font-family="Noto Sans TC, sans-serif" font-size="20" font-weight="700" fill="#101414">資料來源與觸發方式</text>
  <text x="152" y="308" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#4c5855">雲端 CSV／定時抓取／失敗重試／後台立即更新</text>

  <circle cx="92" cy="390" r="18" fill="#007f73"/>
  <text x="92" y="396" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#ffffff">02</text>
  <rect x="128" y="354" width="552" height="88" rx="12" fill="#ffffff" stroke="#d8dedc"/>
  <text x="152" y="385" font-family="Noto Sans TC, sans-serif" font-size="20" font-weight="700" fill="#101414">解析與資料語意</text>
  <text x="152" y="414" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#4c5855">標題列／編碼／跨日時間／欄位採用與正規化</text>

  <circle cx="92" cy="496" r="18" fill="#007f73"/>
  <text x="92" y="502" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#ffffff">03</text>
  <rect x="128" y="460" width="552" height="88" rx="12" fill="#f1f7f6" stroke="#c8dedb"/>
  <text x="152" y="491" font-family="Noto Sans TC, sans-serif" font-size="20" font-weight="700" fill="#101414">檢核與異常擋檔</text>
  <text x="152" y="520" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#4c5855">必填／重複時段／日期區間／格式與內容一致性</text>

  <circle cx="92" cy="602" r="18" fill="#007f73"/>
  <text x="92" y="608" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#ffffff">04</text>
  <rect x="128" y="566" width="552" height="88" rx="12" fill="#ffffff" stroke="#d8dedc"/>
  <text x="152" y="597" font-family="Noto Sans TC, sans-serif" font-size="20" font-weight="700" fill="#101414">安全覆蓋策略</text>
  <text x="152" y="626" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#4c5855">檢核失敗整份不匯入，保留既有資料避免半套上線</text>

  <circle cx="92" cy="708" r="18" fill="#007f73"/>
  <text x="92" y="714" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#ffffff">05</text>
  <rect x="128" y="672" width="552" height="88" rx="12" fill="#f1f7f6" stroke="#c8dedb"/>
  <text x="152" y="703" font-family="Noto Sans TC, sans-serif" font-size="20" font-weight="700" fill="#101414">通知與可追溯紀錄</text>
  <text x="152" y="732" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#4c5855">內部告警與機關通知分流，保留執行與處理結果</text>

  <rect x="64" y="798" width="616" height="58" rx="10" fill="#101414"/>
  <text x="84" y="823" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1" fill="#63c7bb">SCOPE DECISION</text>
  <text x="84" y="846" font-family="Noto Sans TC, sans-serif" font-size="15" fill="#ffffff">同時寫清楚「會做、怎麼做、如何驗」以及「不在本次範圍」。</text>
</svg>
