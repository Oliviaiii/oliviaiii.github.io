<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
  <title id="title">驗收如何被證明</title>
  <desc id="desc">去識別化的節目表介接驗收證據，呈現測試情境、預期行為、實際判定與證據鏈。</desc>
  <rect width="760" height="920" fill="#f7f8f7"/>
  <rect x="32" y="32" width="696" height="856" rx="18" fill="#ffffff" stroke="#d8dedc"/>
  <text x="64" y="78" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="2" fill="#007f73">ANONYMIZED ACCEPTANCE RECORD</text>
  <text x="64" y="132" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="700" fill="#101414">驗收不是一句</text>
  <text x="64" y="176" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="700" fill="#007f73">「測過了」</text>
  <text x="64" y="212" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#5d6865">每個情境都有需求依據、測試資料、預期行為與實際判定。</text>

  <rect x="64" y="248" width="632" height="44" rx="8" fill="#101414"/>
  <text x="84" y="276" font-family="Noto Sans TC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">測試情境</text>
  <text x="308" y="276" font-family="Noto Sans TC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">預期行為</text>
  <text x="626" y="276" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">判定</text>

  <g font-family="Noto Sans TC, sans-serif" font-size="15" fill="#25302d">
    <rect x="64" y="300" width="632" height="74" fill="#f1f7f6"/>
    <text x="84" y="329" font-weight="700">跨日節目</text><text x="84" y="352" fill="#5d6865">午夜前開始、隔日結束</text>
    <text x="308" y="340">日期與起訖時間正確顯示</text>
    <rect x="600" y="319" width="52" height="28" rx="14" fill="#dff3ef"/><text x="626" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#007f73">PASS</text>

    <rect x="64" y="376" width="632" height="74" fill="#ffffff"/>
    <text x="84" y="405" font-weight="700">部分區間異動</text><text x="84" y="428" fill="#5d6865">只提供需要調整的日期</text>
    <text x="308" y="416">僅覆蓋指定區間，其餘不變</text>
    <rect x="600" y="395" width="52" height="28" rx="14" fill="#dff3ef"/><text x="626" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#007f73">PASS</text>

    <rect x="64" y="452" width="632" height="74" fill="#f1f7f6"/>
    <text x="84" y="481" font-weight="700">錯誤檔案</text><text x="84" y="504" fill="#5d6865">缺欄、編碼錯誤或重複時段</text>
    <text x="308" y="492">整份擋下，既有資料維持正常</text>
    <rect x="600" y="471" width="52" height="28" rx="14" fill="#dff3ef"/><text x="626" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#007f73">PASS</text>

    <rect x="64" y="528" width="632" height="74" fill="#ffffff"/>
    <text x="84" y="557" font-weight="700">同檔名重新上傳</text><text x="84" y="580" fill="#5d6865">內容已修正但名稱相同</text>
    <text x="308" y="568">辨識新版本並重新處理</text>
    <rect x="600" y="547" width="52" height="28" rx="14" fill="#dff3ef"/><text x="626" y="566" text-anchor="middle" font-size="13" font-weight="700" fill="#007f73">PASS</text>

    <rect x="64" y="604" width="632" height="74" fill="#f1f7f6"/>
    <text x="84" y="633" font-weight="700">通知與紀錄</text><text x="84" y="656" fill="#5d6865">成功、失敗與人工觸發</text>
    <text x="308" y="644">訊息可理解，且可回查處理結果</text>
    <rect x="600" y="623" width="52" height="28" rx="14" fill="#dff3ef"/><text x="626" y="642" text-anchor="middle" font-size="13" font-weight="700" fill="#007f73">PASS</text>
  </g>

  <text x="64" y="728" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.5" fill="#007f73">RISK QUESTIONS BEFORE BUILD</text>
  <rect x="64" y="746" width="302" height="74" rx="10" fill="#f7f8f7" stroke="#d8dedc"/>
  <text x="84" y="776" font-family="Noto Sans TC, sans-serif" font-size="16" font-weight="700" fill="#101414">檔名與內容區間不一致？</text>
  <text x="84" y="801" font-family="Noto Sans TC, sans-serif" font-size="14" fill="#5d6865">先確認覆蓋依據，避免資料開天窗。</text>
  <rect x="394" y="746" width="302" height="74" rx="10" fill="#f7f8f7" stroke="#d8dedc"/>
  <text x="414" y="776" font-family="Noto Sans TC, sans-serif" font-size="16" font-weight="700" fill="#101414">匯入成功但關聯失效？</text>
  <text x="414" y="801" font-family="Noto Sans TC, sans-serif" font-size="14" fill="#5d6865">用穩定識別與告警抓出靜默失效。</text>

  <rect x="64" y="842" width="632" height="46" rx="10" fill="#101414"/>
  <text x="380" y="871" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="15" fill="#ffffff">需求編號 → 測試資料 → 系統紀錄 → 實際畫面 → 驗收結論</text>
</svg>
